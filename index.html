    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      @import url('https://rsms.me/inter/inter.css');
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic&display=swap');

      .font-noto-serif-ethiopian {
        font-family: 'Noto Serif Ethiopic', serif;
      }

      /* Shimmer animation for skeleton loader */
      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }

      .shimmer-bg {
        position: relative;
        overflow: hidden;
        background-color: #e2e8f0; /* bg-slate-200 in Tailwind */
      }

      .dark .shimmer-bg {
        background-color: #475569; /* bg-slate-600, for better shimmer contrast */
      }

      .shimmer-bg::after {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        background-image: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0,
          rgba(255, 255, 255, 0.2) 20%,
          rgba(255, 255, 255, 0.5) 60%,
          rgba(255, 255, 255, 0)
        );
        animation: shimmer 2s infinite;
      }

      .dark .shimmer-bg::after {
          background-image: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0,
          rgba(255, 255, 255, 0.05) 20%,
          rgba(255, 255, 255, 0.1) 60%,
          rgba(255, 255, 255, 0)
        );
      }
    </style>
